# Status bar on top
set -g status-position top

# Second, empty status line as spacing between the bar and the panes
set -g status 2
set -g status-format[1] ""

# Theme: rounded Material pills in the style of DankMaterialShell.
# Uses terminal palette indexes (not hex) so it follows the colors DMS generates for kitty:
# colour0 = surface, colour5 = primary container, colour6 = primary, colour7 = on-surface, colour8 = surface variant
set -g status-style "bg=default,fg=colour7"
set -g status-left-length 40
set -g status-right-length 60
set -g window-status-separator ""

# Session pill; turns yellow while the prefix key is pressed
set -g status-left "#[fg=#{?client_prefix,colour3,colour6},bg=default]#[fg=colour0,bg=#{?client_prefix,colour3,colour6},bold] #S#[fg=#{?client_prefix,colour3,colour6},bg=default,nobold] "

# Inactive windows get spaces where the active pill has its rounded caps, so tabs don't shift
set -g window-status-format " #I #W#{?window_zoomed_flag, ,} "
set -g window-status-current-format "#[fg=colour5]#[fg=colour6,bg=colour5,bold]#I #W#{?window_zoomed_flag, ,}#[fg=colour5,bg=default,nobold]"
set -g window-status-activity-style "fg=colour6,italics"
set -g window-status-bell-style "fg=colour1,bold"

set -g status-right "#[fg=colour8]#[fg=colour7,bg=colour8] #h#[fg=colour8,bg=default] #[fg=colour6]#[fg=colour0,bg=colour6,bold] %H:%M#[fg=colour6,bg=default,nobold]"

set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour6"
set -g message-style "bg=colour8,fg=colour7"
set -g message-command-style "bg=colour8,fg=colour6"
set -g mode-style "bg=colour6,fg=colour0"

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# Vi keys in copy mode
setw -g mode-keys vi

# Let apps inside tmux (e.g. nvim over SSH) copy to the system clipboard via OSC 52
set -g set-clipboard on

# Open new split panes in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Increase scrollback
set -g history-limit 100000

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

